name: v3

on:
  push:
    branches: ["feat/lighting-3.0"]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "deny.toml", "rustfmt.toml", ".cargo/**", ".github/workflows/v3.yml"]
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "deny.toml", "rustfmt.toml", ".cargo/**", ".github/workflows/v3.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable
          rustc --version
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - name: Format
        id: fmt
        continue-on-error: true
        run: cargo fmt --all --check
      - name: Lint
        id: lint
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: ffmpeg for the video tests
        if: runner.os == 'Linux'
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg && echo "LT_NEED_FFMPEG=1" >> "$GITHUB_ENV"
      - name: Test
        id: test
        continue-on-error: true
        run: cargo nextest run --workspace --locked --no-tests=pass --no-fail-fast
      - name: Licenses and advisories
        id: deny
        if: runner.os == 'Linux'
        continue-on-error: true
        run: cargo deny check
      - name: Release build
        id: build
        continue-on-error: true
        run: cargo build --release --locked -p lighting
      - name: Size
        if: steps.build.outcome == 'success'
        shell: bash
        run: ls -l target/release/ | grep -E "lighting(\.exe)?$"
      - name: Keep the Windows exe
        if: runner.os == 'Windows' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: lighting-v3-windows
          path: target/release/lighting.exe
          retention-days: 7
      - name: Result
        if: always()
        shell: bash
        run: echo "::notice title=v3 ${{ matrix.os }}::fmt=${{ steps.fmt.outcome }} lint=${{ steps.lint.outcome }} test=${{ steps.test.outcome }} deny=${{ steps.deny.outcome }} build=${{ steps.build.outcome }}"
