name: ci

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dependencies resolve
        run: python -m pip install -r requirements.txt
      - name: Every module compiles
        run: python -m compileall -q lighting tests
      - name: Unit tests
        run: python tests/test_units.py
      - name: Plugin manifests agree
        shell: bash
        run: |
          python - <<'EOF'
          import json
          claude = json.load(open(".claude-plugin/plugin.json"))
          codex = json.load(open(".codex-plugin/plugin.json"))
          hooks = json.load(open("hooks/hooks.json"))
          json.load(open(".mcp.json"))
          assert claude["version"] == codex["version"], (claude["version"], codex["version"])
          assert hooks["hooks"]["Stop"][0]["hooks"][0]["command"].endswith("done --quiet")
          print("version", claude["version"])
          EOF

  extension:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Extension modules parse
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ext"
          for f in extension/*.js; do cp "$f" "$RUNNER_TEMP/ext/$(basename "${f%.js}").mjs"; done
          for f in "$RUNNER_TEMP"/ext/*.mjs; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"

  client:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings
      - name: Hash of the build
        shell: bash
        run: sha256sum target/release/lighting.exe ../bin/lighting.exe
