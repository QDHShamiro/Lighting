name: release

on:
  push:
    tags: ["v*"]
    branches: ["release/dry-run"]
    paths: [".github/workflows/release.yml", "mcpb/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            pack: windows-x64
            client: wisply.exe
          - os: macos-latest
            pack: macos-universal
            client: wisply-macos
          - os: ubuntu-24.04
            pack: linux-x64
            client: wisply-linux-x64
          - os: ubuntu-24.04-arm
            pack: linux-arm64
            client: wisply-linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          if [ "$RUNNER_OS" = macOS ]; then rustup target add x86_64-apple-darwin aarch64-apple-darwin; fi
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxkbcommon-dev libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Build
        shell: bash
        run: |
          mkdir out
          if [ "$RUNNER_OS" = macOS ]; then
            for t in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --release --locked --target "$t" -p wisply -p wisply-ui
            done
            for b in wisply wisply-ui; do
              lipo -create -output "out/$b" "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
            done
          else
            cargo build --release --locked -p wisply -p wisply-ui
            if [ "$RUNNER_OS" = Windows ]; then
              cp target/release/wisply.exe target/release/wisply-ui.exe target/release/wisply-task.exe out/
            else
              cp target/release/wisply target/release/wisply-ui out/
            fi
          fi
      - name: Unsigned Windows programs
        id: unsigned
        if: runner.os == 'Windows' && github.ref_type == 'tag' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows
          path: out/*.exe
      - name: Sign with SignPath
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Use the signed programs
        if: steps.unsigned.outcome == 'success'
        shell: bash
        run: |
          cp signed/*.exe out/
          ls -l out
      - name: Pack
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || v="$(git rev-parse --short HEAD)"
          L=out/wisply; [ "$RUNNER_OS" = Windows ] && L=out/wisply.exe
          "$L" --version
          d="wisply-$v-${{ matrix.pack }}"
          mkdir -p "pack/$d/skills" dist
          cp -R out/. "pack/$d/"
          cp -R extension "pack/$d/extension"
          cp -R skills/wisply "pack/$d/skills/wisply"
          cp LICENSE NOTICE README.md "pack/$d/"
          cp "$L" "dist/${{ matrix.client }}"
          if [ "$RUNNER_OS" = Windows ]; then
            (cd pack && 7z a -tzip -bso0 "../dist/$d.zip" "$d")
          else
            tar -C pack -czf "dist/$d.tar.gz" "$d"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pack }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the versions
        if: github.ref_type == 'tag'
        run: |
          v="${GITHUB_REF_NAME#v}"
          p=$(jq -r .version .claude-plugin/plugin.json)
          c=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          test "$p" = "$v" || { echo "tag $GITHUB_REF_NAME but plugin.json says $p"; exit 1; }
          test "$c" = "$v" || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $c"; exit 1; }
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Desktop extension (mcpb) and source
        run: |
          chmod +x dist/wisply-macos dist/wisply-linux-*
          s=mcpb/stage
          mkdir -p "$s/bin" "$s/skills"
          cp dist/wisply.exe dist/wisply-macos dist/wisply-linux-x64 dist/wisply-linux-arm64 "$s/bin/"
          cp -R extension "$s/extension"
          cp -R skills/wisply "$s/skills/wisply"
          cp LICENSE NOTICE README.md "$s/"
          if [ -f docs/icon.png ]; then cp docs/icon.png "$s/icon.png"; fi
          jq --arg v "$(jq -r .version .claude-plugin/plugin.json)" '.version = $v' mcpb/manifest.json > "$s/manifest.json"
          npx -y @anthropic-ai/mcpb@2.1.2 pack "$s" "$PWD/dist/wisply.mcpb"
          rm -rf "$s"
          git archive --format=zip -o "dist/wisply-${GITHUB_REF_NAME//\//-}-source.zip" HEAD
      - uses: actions/attest-build-provenance@v3
        if: github.ref_type == 'tag'
        with:
          subject-path: dist/*
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || v=$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {on=1; next} on && index($0, "## [") == 1 {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section [$v]"; exit 1; }
          printf '\n### Checksums (SHA-256)\n```\n' >> notes.md
          cat dist/SHA256SUMS.txt >> notes.md
          printf '```\nEvery file here has a GitHub build attestation: `gh attestation verify <file> -R QDHShamiro/Wisply`\n' >> notes.md
          printf '\nCode signing policy: https://github.com/QDHShamiro/Wisply/blob/main/CODE_SIGNING.md\n' >> notes.md
      - name: Keep the files (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: |
            dist/*
            notes.md
          retention-days: 7
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Wisply $GITHUB_REF_NAME" --notes-file notes.md
