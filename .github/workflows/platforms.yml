name: platforms

on:
  push:
    branches: ["ci/**", "feat/lighting-2.0-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: lighting-macos
          - os: ubuntu-24.04
            name: lighting-linux-x64
          - os: ubuntu-24.04-arm
            name: lighting-linux-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output ${{ matrix.name }} target/aarch64-apple-darwin/release/lighting target/x86_64-apple-darwin/release/lighting
          lipo -info ${{ matrix.name }}
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          cp target/release/lighting ${{ matrix.name }}
      - name: Test and lint
        run: |
          cargo test --release --locked
          cargo clippy --release --all-targets --locked -- -D warnings
      - name: Hash
        run: shasum -a 256 ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: client/${{ matrix.name }}

  selftest:
    needs: client
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            client: lighting-macos
          - os: ubuntu-24.04
            client: lighting-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.client }}
          path: bin
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Linux desktop packages
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          for try in 1 2 3; do
            sudo dpkg --configure -a
            sudo timeout 120 apt-get update -qq && sudo timeout 240 apt-get install -y -qq xvfb openbox at-spi2-core \
              python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0 xclip tesseract-ocr ffmpeg dbus-x11 x11-utils xdotool > /dev/null && break
            [ "$try" = 3 ] && exit 1
            echo "apt try $try hung or failed, trying again"
          done
      - name: Chrome for Testing
        shell: bash
        run: |
          out=$(npx -y @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/cft" | tail -1)
          echo "CHROME=${out#* }" >> "$GITHUB_ENV"
          echo "${out#* }"
      - name: Run the platform checks
        shell: bash
        run: bash tests/ci_unix.sh "${{ matrix.client }}"
      - name: Report
        if: always()
        shell: bash
        run: python3 tests/ci_report.py "$RUNNER_TEMP/lighting-ci.log" "${{ matrix.os }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/lighting-ci.log
            ${{ runner.temp }}/shots/
            ~/.lighting/daemon.log
