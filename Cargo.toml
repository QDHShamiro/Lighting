[workspace]
members = ["crates/*"]
exclude = ["client"]
resolver = "3"

[workspace.package]
version = "3.0.0-dev.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/QDHShamiro/Lighting"
publish = false

[workspace.dependencies]
lt-proto = { path = "crates/lt-proto" }
lt-squeeze = { path = "crates/lt-squeeze" }
proptest = { version = "1", default-features = false, features = ["std"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
