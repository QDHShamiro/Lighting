[workspace]
members = ["crates/*"]
exclude = ["client"]
resolver = "3"

[workspace.package]
version = "3.0.0-dev.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/QDHShamiro/Lighting"
publish = false

[workspace.dependencies]
lt-proto = { path = "crates/lt-proto" }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
