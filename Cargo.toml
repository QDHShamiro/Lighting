[workspace]
members = ["crates/*"]
exclude = ["client"]
resolver = "3"

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/QDHShamiro/Lighting"
publish = false

[workspace.dependencies]
base64 = "0.22"
encoding_rs = "0.8"
half = { version = "2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
pdf-extract = "0.12"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "gzip"] }
lt-core = { path = "crates/lt-core" }
lt-memory = { path = "crates/lt-memory" }
lt-proto = { path = "crates/lt-proto" }
lt-code = { path = "crates/lt-code" }
lt-squeeze = { path = "crates/lt-squeeze" }
proptest = { version = "1", default-features = false, features = ["std"] }
rusqlite = { version = "0.41", features = ["bundled"] }
roxmltree = "0.21"
fancy-regex = { version = "0.20", default-features = false, features = ["std", "perf"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tree-sitter = "0.27"
tao = { version = "0.37", default-features = false, features = ["rwh_06", "x11"] }
wry = { version = "0.57", default-features = false, features = ["os-webview", "x11"] }
xa11y = { version = "0.15", default-features = false }
x11rb = { version = "0.14", default-features = false }
tree-sitter-language-pack = { version = "1.22", default-features = false, features = ["download"] }
windows = { version = "0.62", features = [
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
