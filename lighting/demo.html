<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lighting demo</title>
<style>
:root { --ink: #111; --mute: #6b6b6b; --line: #e3e3e3; --paper: #fff; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 56px 24px; }
h1 { font-size: 40px; letter-spacing: -0.02em; margin: 0 0 6px; }
p.lead { color: var(--mute); margin: 0 0 40px; }
table { width: 100%; border-collapse: collapse; margin-bottom: 40px; }
th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--line); }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mute); font-weight: 600; }
form { display: grid; gap: 16px; max-width: 420px; }
label { display: grid; gap: 6px; font-size: 14px; }
input[type=text], input[type=email], select { font: inherit; padding: 10px 12px; border: 1px solid var(--ink); border-radius: 0; background: var(--paper); }
label.row { display: flex; gap: 10px; align-items: center; }
button { font: inherit; font-weight: 600; padding: 12px 16px; background: var(--ink); color: var(--paper); border: 0; cursor: pointer; }
#done { display: none; border: 1px solid var(--ink); padding: 20px; margin-top: 24px; max-width: 420px; }
#done.show { display: block; }
#error { color: #b00020; min-height: 1.5em; font-size: 14px; }
</style>
</head>
<body>
<main>
<h1>Paper Planes</h1>
<p class="lead">A made-up shop for the Lighting demo. Nothing here leaves your computer.</p>
<table>
<thead><tr><th>Plan</th><th>Price</th><th>Seats</th><th>Storage</th></tr></thead>
<tbody>
<tr><td>Free</td><td>0 &euro;</td><td>1</td><td>1 GB</td></tr>
<tr><td>Pro</td><td>9 &euro; / month</td><td>5</td><td>100 GB</td></tr>
<tr><td>Team</td><td>29 &euro; / month</td><td>25</td><td>1 TB</td></tr>
</tbody>
</table>
<form id="signup" novalidate>
<label>Name <input id="name" type="text" autocomplete="off"></label>
<label>Email <input id="email" type="email" autocomplete="off"></label>
<label>Plan <select id="plan"><option>Free</option><option>Pro</option><option>Team</option></select></label>
<label class="row"><input id="terms" type="checkbox"> I accept the terms</label>
<div id="error" role="alert"></div>
<button type="submit">Start free trial</button>
</form>
<section id="done" aria-live="polite"></section>
</main>
<script>
document.getElementById("signup").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const plan = document.getElementById("plan").value;
  const error = document.getElementById("error");
  if (!name || !email.includes("@")) { error.textContent = "Please enter your name and email."; return; }
  if (!document.getElementById("terms").checked) { error.textContent = "Please accept the terms."; return; }
  error.textContent = "";
  const done = document.getElementById("done");
  done.textContent = "Welcome, " + name.split(" ")[0] + "! Your " + plan + " trial is ready. Order #1042, 0.00 € today.";
  done.classList.add("show");
  document.getElementById("signup").style.display = "none";
});
</script>
</body>
</html>
